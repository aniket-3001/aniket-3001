name: user stats

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

jobs:
  stats:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6

      - name: stats card
        uses: cicirello/user-statistician@v1
        with:
          image-file: assets/stats.svg
          colors: "#fbf1e0 #e6cfae #e08a1e #3b2a1f #5b4636"
          include-title: false
          hide-keys: general, repositories, private
          language-repository-exclusions: Network-Science-Project
          commit-message: update stats
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
